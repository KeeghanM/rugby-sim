<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rugby Sim</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
      }

      #renderCanvas {
        display: block;
        width: 100dvw;
        height: 100dvh;
        touch-action: none;
      }

      /* TV Broadcast Bug - Top Left */
      #tv-scoreboard {
        position: fixed;
        z-index: 25;
        top: 1.2rem;
        left: 1.2rem;
        display: flex;
        flex-direction: column;
        border-radius: 0.5rem;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          rgb(15 23 42 / 92%) 0%,
          rgb(30 41 59 / 95%) 100%
        );
        backdrop-filter: blur(10px);
        border: 1px solid rgb(255 255 255 / 18%);
        box-shadow:
          0 8px 24px rgb(0 0 0 / 55%),
          inset 0 1px 0 rgb(255 255 255 / 15%);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #f8fafc;
        min-width: 270px;
      }

      .tv-top-row {
        display: flex;
        align-items: stretch;
        height: 38px;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
      }

      .tv-team {
        display: flex;
        align-items: center;
        flex: 1;
        padding: 0 0.6rem;
        gap: 0.4rem;
        border-bottom: 3px solid transparent;
        transition:
          border-bottom-color 0.2s ease,
          background 0.2s ease;
      }

      .tv-team.possession.tv-team-0 {
        border-bottom: 3px solid #3b82f6;
        background: rgb(59 130 246 / 20%);
      }

      .tv-team.possession.tv-team-1 {
        border-bottom: 3px solid #ef4444;
        background: rgb(239 68 68 / 20%);
      }

      .tv-team-badge {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .tv-team-0 .tv-team-badge {
        background: #1d4ed8;
        box-shadow: 0 0 8px #3b82f6;
      }
      .tv-team-1 .tv-team-badge {
        background: #dc2626;
        box-shadow: 0 0 8px #ef4444;
      }

      .tv-team-name {
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.05em;
        color: #f1f5f9;
      }

      .tv-team-score {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1.25rem;
        font-weight: 800;
        color: #ffffff;
        margin-left: auto;
      }

      .tv-team-1 .tv-team-score {
        margin-left: 0;
        margin-right: auto;
      }

      .tv-team-divider {
        width: 1px;
        background: rgb(255 255 255 / 15%);
        margin: 4px 0;
      }

      .tv-clock-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 0.65rem;
        background: rgb(0 0 0 / 35%);
        border-left: 1px solid rgb(255 255 255 / 12%);
        min-width: 68px;
      }

      .tv-clock {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88rem;
        font-weight: 700;
        color: #38bdf8;
        line-height: 1.1;
      }

      .tv-half {
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #94a3b8;
        text-transform: uppercase;
      }

      .tv-bottom-bar {
        display: flex;
        align-items: center;
        padding: 0.35rem 0.6rem;
        gap: 0.5rem;
        background: rgb(0 0 0 / 25%);
        font-size: 0.74rem;
      }

      .tv-phase-pill {
        background: #eab308;
        color: #0f172a;
        font-weight: 800;
        font-size: 0.65rem;
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .tv-meters {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        color: #4ade80;
        font-size: 0.8rem;
      }

      .tv-shot-clock {
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        background: #dc2626;
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.7rem;
        font-weight: 800;
      }

      .tv-status {
        color: #cbd5e1;
        font-weight: 500;
        margin-left: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 140px;
      }

      #scoreboard {
        display: none;
      }

      #ui-controls {
        position: fixed;
        z-index: 20;
        bottom: 1.2rem;
        left: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding: 0.75rem 0.9rem;
        border-radius: 0.5rem;
        background: rgb(15 23 42 / 85%);
        backdrop-filter: blur(8px);
        border: 1px solid rgb(255 255 255 / 15%);
        color: #f8fafc;
        box-shadow: 0 4px 16px rgb(0 0 0 / 40%);
        font-size: 0.82rem;
        min-width: 200px;
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      #ui-controls.collapsed .controls-panel {
        display: none;
      }

      .controls-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        color: #94a3b8;
        cursor: pointer;
      }

      .controls-toggle-btn {
        background: none;
        border: none;
        color: #38bdf8;
        font:
          600 0.78rem system-ui,
          sans-serif;
        cursor: pointer;
        padding: 0.2rem 0.4rem;
        border-radius: 0.3rem;
      }

      .controls-toggle-btn:hover {
        background: rgb(255 255 255 / 10%);
      }

      .controls-panel {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .control-row {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .control-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 500;
        color: #cbd5e1;
      }

      .speed-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 600;
        color: #38bdf8;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 5px;
        border-radius: 3px;
        background: #334155;
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #38bdf8;
        cursor: pointer;
        box-shadow: 0 0 6px rgb(56 189 248 / 60%);
        transition: transform 0.1s;
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: #38bdf8;
        cursor: pointer;
        box-shadow: 0 0 6px rgb(56 189 248 / 60%);
        transition: transform 0.1s;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        padding-top: 0.4rem;
        border-top: 1px solid rgb(255 255 255 / 10%);
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #334155;
        transition: 0.2s;
        border-radius: 18px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: #38bdf8;
      }

      input:checked + .slider:before {
        transform: translateX(16px);
      }

      #debug-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 10;
        display: none;
      }

      .debug-card {
        position: absolute;
        transform: translate(-50%, -100%) translateY(-8px);
        background: rgb(15 23 42 / 92%);
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 5px;
        padding: 4px 6px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        line-height: 1.25;
        color: #f1f5f9;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgb(0 0 0 / 50%);
        display: none;
        backdrop-filter: blur(4px);
        pointer-events: none;
      }

      .debug-card.team-0 {
        border-left: 3px solid #3b82f6;
      }

      .debug-card.team-1 {
        border-left: 3px solid #ef4444;
      }

      .debug-card.ball-card {
        border-left: 3px solid #facc15;
      }

      .debug-card-header {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 700;
        font-size: 10px;
        margin-bottom: 2px;
        color: #ffffff;
      }

      .debug-card-row {
        color: #94a3b8;
      }

      .debug-card-row .val {
        color: #e2e8f0;
        font-weight: 500;
      }

      .debug-card-row .highlight {
        color: #facc15;
        font-weight: 600;
      }

      .debug-badge {
        display: inline-block;
        padding: 1px 3px;
        border-radius: 2px;
        font-size: 8.5px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge-carrier {
        background: #eab308;
        color: #000;
      }

      .badge-offside {
        background: #ef4444;
        color: #fff;
      }

      .cam-row {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        padding-top: 0.4rem;
        border-top: 1px solid rgb(255 255 255 / 10%);
      }

      .cam-label {
        font-weight: 500;
        color: #cbd5e1;
      }

      .cam-buttons {
        display: flex;
        gap: 0.35rem;
      }

      .cam-btn {
        flex: 1;
        padding: 0.3rem 0.4rem;
        border-radius: 0.35rem;
        border: 1px solid rgb(255 255 255 / 15%);
        background: #334155;
        color: #e2e8f0;
        font:
          600 0.73rem/1 system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }

      .cam-btn:hover {
        background: #475569;
      }

      .cam-btn.active {
        background: #38bdf8;
        border-color: #38bdf8;
        color: #0f172a;
      }

      .cam-hint {
        font-size: 0.7rem;
        color: #94a3b8;
        line-height: 1.3;
      }

      .manager-view-btn-floating {
        position: fixed;
        z-index: 22;
        top: 1.2rem;
        right: 1.2rem;
        margin-left: 215px;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgb(56 189 248 / 40%);
        color: #38bdf8;
        font:
          700 0.82rem/1.2 system-ui,
          sans-serif;
        padding: 0.55rem 0.85rem;
        border-radius: 0.5rem;
        cursor: pointer;
        box-shadow: 0 4px 16px rgb(0 0 0 / 45%);
        backdrop-filter: blur(8px);
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .manager-view-btn-floating:hover {
        background: #334155;
        border-color: #38bdf8;
        transform: translateY(-1px);
      }

      /* Manager View Modal */
      #manager-modal {
        position: fixed;
        z-index: 50;
        inset: 0;
        background: rgb(0 0 0 / 70%);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      #manager-modal.active {
        display: flex;
      }

      .manager-dialog {
        background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 0.75rem;
        box-shadow: 0 20px 45px rgb(0 0 0 / 70%);
        width: 100%;
        max-width: 820px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: #f8fafc;
      }

      .manager-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        background: rgb(0 0 0 / 25%);
      }

      .manager-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .manager-close-btn {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 1.3rem;
        cursor: pointer;
        padding: 0.2rem 0.5rem;
        border-radius: 0.3rem;
        line-height: 1;
      }

      .manager-close-btn:hover {
        color: #ffffff;
        background: rgb(255 255 255 / 10%);
      }

      .manager-tabs {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem 0;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
      }

      .manager-team-tabs {
        display: flex;
        gap: 0.5rem;
      }

      .manager-subtabs {
        display: flex;
        gap: 0.35rem;
        background: rgb(0 0 0 / 30%);
        padding: 0.2rem;
        border-radius: 0.4rem;
        border: 1px solid rgb(255 255 255 / 10%);
        margin-bottom: 0.4rem;
      }

      .manager-subtab-btn {
        padding: 0.3rem 0.65rem;
        border: none;
        background: transparent;
        color: #94a3b8;
        font:
          600 0.76rem system-ui,
          sans-serif;
        cursor: pointer;
        border-radius: 0.3rem;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .manager-subtab-btn:hover {
        color: #f1f5f9;
      }

      .manager-subtab-btn.active {
        background: #38bdf8;
        color: #0f172a;
      }

      .stat-highlight-gold {
        color: #facc15;
        font-weight: 700;
      }

      .stat-highlight-cyan {
        color: #38bdf8;
        font-weight: 700;
      }

      .stat-highlight-green {
        color: #4ade80;
        font-weight: 700;
      }

      .team-tab-btn {
        padding: 0.5rem 1rem;
        border: none;
        border-bottom: 2px solid transparent;
        background: none;
        color: #94a3b8;
        font:
          600 0.88rem system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .team-tab-btn.active {
        color: #38bdf8;
        border-bottom-color: #38bdf8;
      }

      .manager-body {
        padding: 1rem 1.25rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .team-summary-card {
        background: rgb(0 0 0 / 30%);
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.75rem;
        font-size: 0.8rem;
      }

      .summary-item {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .summary-label {
        color: #94a3b8;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .summary-val {
        font-weight: 600;
        color: #f1f5f9;
      }

      .roster-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }

      .roster-table th {
        text-align: left;
        padding: 0.45rem 0.6rem;
        color: #94a3b8;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
      }

      .roster-table td {
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid rgb(255 255 255 / 6%);
        vertical-align: middle;
      }

      .roster-table tr:hover td {
        background: rgb(255 255 255 / 4%);
      }

      .player-num-col {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        color: #38bdf8;
        width: 32px;
      }

      .player-role-col {
        font-weight: 600;
        color: #f1f5f9;
      }

      .player-pod-badge {
        display: inline-block;
        padding: 0.1rem 0.35rem;
        border-radius: 0.2rem;
        font-size: 0.68rem;
        background: rgb(255 255 255 / 10%);
        color: #cbd5e1;
        margin-left: 0.4rem;
      }

      .skill-badge {
        font-weight: 700;
        color: #facc15;
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
      }

      /* Stamina Indicative Bar (No exact percentage text) */
      .stamina-bar-container {
        width: 110px;
        height: 8px;
        background: #334155;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .stamina-bar-fill {
        height: 100%;
        border-radius: 4px;
        transition:
          width 0.2s,
          background-color 0.2s;
        background: #22c55e;
      }

      .stamina-bar-fill.stamina-mid {
        background: #eab308;
      }

      .stamina-bar-fill.stamina-low {
        background: #ef4444;
      }

      #pregame {
        position: fixed;
        z-index: 100;
        inset: 0;
        overflow-y: auto;
        background:
          radial-gradient(circle at 50% -20%, #1e3a5f 0, transparent 42%),
          #020617;
        color: #f8fafc;
        user-select: auto;
      }

      #pregame.hidden {
        display: none;
      }

      #pregame:not(.hidden) ~ #tv-scoreboard,
      #pregame:not(.hidden) ~ #ui-controls,
      #pregame:not(.hidden) ~ #manager-view-btn,
      #pregame:not(.hidden) ~ #manager-modal,
      #pregame:not(.hidden) ~ #scoreboard,
      #pregame:not(.hidden) ~ #debug-overlay {
        display: none;
      }

      .config-shell {
        width: min(1440px, 100%);
        min-height: 100%;
        margin: 0 auto;
        background: rgb(15 23 42 / 96%);
        border-inline: 1px solid rgb(255 255 255 / 12%);
        box-shadow: 0 0 60px rgb(0 0 0 / 55%);
      }

      .config-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1.5rem;
        min-height: 88px;
        padding: 1rem clamp(1rem, 3vw, 2.5rem);
        background: linear-gradient(180deg, #0f172a 0%, #111c32 100%);
        color: #f7f3e8;
        border-bottom: 3px solid var(--active-team);
        box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
      }

      .config-brand span,
      .eyebrow,
      .section-heading > div > span {
        display: block;
        color: #94a3b8;
        font-size: 0.67rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .config-brand span {
        color: #38bdf8;
      }

      .config-brand h1 {
        margin: 0;
        font-size: 1.55rem;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .team-switcher {
        display: flex;
        gap: 0.35rem;
        padding: 0.3rem;
        background: rgb(0 0 0 / 35%);
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 0.45rem;
      }

      .team-switcher button {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 130px;
        border: 0;
        background: transparent;
        color: #94a3b8;
        cursor: pointer;
        padding: 0.6rem 0.8rem;
        font-weight: 800;
        text-align: left;
      }

      .team-switcher button i {
        width: 0.65rem;
        height: 0.65rem;
        background: var(--swatch);
        border-radius: 50%;
      }

      .team-switcher button.selected {
        background: #334155;
        color: #f8fafc;
        box-shadow: inset 0 -2px var(--swatch);
      }

      .start-match {
        justify-self: end;
        border: 1px solid rgb(56 189 248 / 50%);
        border-radius: 0.45rem;
        background: #38bdf8;
        color: #0f172a;
        cursor: pointer;
        padding: 0.75rem 1.4rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .start-match:hover,
      .start-match:focus-visible {
        background: #7dd3fc;
        outline: 2px solid #38bdf8;
        outline-offset: 3px;
      }

      .config-tabs {
        display: flex;
        align-items: center;
        gap: 0;
        min-height: 58px;
        padding-inline: clamp(1rem, 3vw, 2.5rem);
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        background: rgb(15 23 42 / 92%);
      }

      .config-tabs > button {
        align-self: stretch;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: #94a3b8;
        cursor: pointer;
        padding: 0 1.15rem;
        font-size: 0.76rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .config-tabs > button.selected {
        border-color: var(--active-team);
        color: #f1f5f9;
      }

      .team-identity {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-left: auto;
        color: #94a3b8;
        font-size: 0.7rem;
        font-weight: 800;
      }

      .team-identity input[type="text"],
      .team-identity input:not([type]) {
        width: 130px;
        border: 0;
        border-bottom: 1px solid #475569;
        outline: 0;
        background: transparent;
        color: #f1f5f9;
        padding: 0.35rem;
        font-weight: 800;
      }

      .team-identity input[type="color"] {
        width: 1.8rem;
        height: 1.8rem;
        padding: 0;
        border: 0;
        background: transparent;
      }

      .config-content {
        padding: clamp(1rem, 2.5vw, 2.25rem);
        background:
          linear-gradient(rgb(15 23 42 / 95%), rgb(15 23 42 / 98%)),
          repeating-linear-gradient(
            90deg,
            transparent 0 9.9%,
            rgb(56 189 248 / 8%) 10%
          );
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .section-heading h2,
      .player-editor h2 {
        margin: 0.18rem 0 0;
        font-size: 1.35rem;
        font-weight: 750;
      }

      .section-heading p {
        max-width: 32rem;
        margin: 0;
        color: #94a3b8;
        font-size: 0.74rem;
        line-height: 1.4;
      }

      .squad-layout {
        display: grid;
        grid-template-columns: minmax(480px, 1.3fr) minmax(280px, 0.7fr);
        gap: 1.5rem;
      }

      .team-ratings {
        grid-column: 1 / -1;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
      }

      .ratings-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(120px, 1fr));
        gap: 1rem;
      }

      .rating-control,
      .mix-control {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.35rem;
        color: #cbd5e1;
        font-size: 0.72rem;
        font-weight: 850;
      }

      .rating-control input,
      .mix-control input {
        grid-column: 1 / -1;
        accent-color: var(--active-team);
      }

      .rating-control output,
      .mix-control output {
        color: #38bdf8;
        font-variant-numeric: tabular-nums;
        font-weight: 950;
      }

      .roster-panel {
        min-width: 0;
      }

      .roster-head,
      .roster-row {
        display: grid;
        grid-template-columns: 2rem minmax(130px, 1fr) repeat(7, 3.35rem);
        align-items: center;
        gap: 0.25rem;
      }

      .roster-head {
        padding: 0 0.65rem 0.45rem;
        color: #64748b;
        font-size: 0.62rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .roster-row {
        width: 100%;
        border: 0;
        border-top: 1px solid rgb(255 255 255 / 8%);
        background: transparent;
        color: #e2e8f0;
        cursor: pointer;
        padding: 0.57rem 0.65rem;
        text-align: left;
      }

      .roster-row:hover,
      .roster-row.selected {
        background: rgb(51 65 85 / 65%);
      }

      .roster-row.selected {
        box-shadow: inset 3px 0 var(--active-team);
      }

      .roster-row b {
        color: var(--active-team);
      }

      .roster-row span {
        overflow: hidden;
        font-size: 0.75rem;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .roster-row i {
        color: #cbd5e1;
        font-size: 0.72rem;
        font-style: normal;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .player-editor {
        align-self: start;
        position: sticky;
        top: 1rem;
        padding: 1.3rem;
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 0.55rem;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        color: #eef0e8;
        box-shadow: 0 12px 30px rgb(0 0 0 / 35%);
      }

      .player-shirt {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4rem;
        margin-bottom: 1rem;
        background: var(--team-color);
        clip-path: polygon(
          18% 0,
          35% 10%,
          65% 10%,
          82% 0,
          100% 24%,
          85% 38%,
          80% 100%,
          20% 100%,
          15% 38%,
          0 24%
        );
        color: white;
        font:
          900 1.45rem Georgia,
          serif;
      }

      .player-editor .eyebrow {
        color: #38bdf8;
      }

      .player-rating-list {
        display: grid;
        gap: 0.85rem;
        margin-top: 1.25rem;
      }

      .player-editor .rating-control {
        color: #cbd5e1;
      }

      .player-editor .rating-control output {
        color: #f8fafc;
      }

      .tactics-layout {
        display: grid;
        gap: 1px;
        gap: 0.75rem;
        background: transparent;
        border: 0;
      }

      .tactic-block {
        padding: clamp(1.2rem, 3vw, 2.5rem);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 0.55rem;
        background: rgb(30 41 59 / 72%);
        box-shadow: 0 8px 22px rgb(0 0 0 / 22%);
      }

      .mix-stack {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
      }

      .mix-carry input {
        accent-color: #9d632c;
      }

      .mix-pass input {
        accent-color: #2f6b55;
      }

      .mix-kick input {
        accent-color: #3f5e88;
      }

      .mix-bar {
        display: flex;
        height: 0.65rem;
        margin-top: 1rem;
        overflow: hidden;
      }

      .mix-bar i:nth-child(1) {
        background: #9d632c;
      }
      .mix-bar i:nth-child(2) {
        background: #2f6b55;
      }
      .mix-bar i:nth-child(3) {
        background: #3f5e88;
      }

      .choice-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }

      .choice {
        display: grid;
        gap: 0.3rem;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 0.4rem;
        background: #1e293b;
        color: #e2e8f0;
        cursor: pointer;
        padding: 1rem;
        text-align: left;
      }

      .choice span {
        color: #94a3b8;
        font-size: 0.72rem;
      }

      .choice.selected {
        border-color: var(--active-team);
        box-shadow: inset 0 -4px var(--active-team);
        background: #334155;
      }

      .lineout-size {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.25rem;
        color: #94a3b8;
        font-size: 0.75rem;
        font-weight: 800;
      }

      .number-choice,
      .preset-row button,
      .reset-shape {
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 0.35rem;
        background: #1e293b;
        color: #cbd5e1;
        cursor: pointer;
        padding: 0.45rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 850;
      }

      .number-choice.selected,
      .preset-row button.selected {
        border-color: var(--active-team);
        background: var(--active-team);
        color: white;
      }

      .shape-layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        min-height: 680px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 0.55rem;
        background: rgb(15 23 42 / 72%);
        box-shadow: 0 12px 30px rgb(0 0 0 / 28%);
      }

      .shape-menu {
        padding: 1rem;
        background: rgb(0 0 0 / 24%);
        border-right: 1px solid rgb(255 255 255 / 12%);
      }

      .shape-menu > button {
        width: 100%;
        border: 0;
        border-bottom: 1px solid rgb(255 255 255 / 8%);
        background: transparent;
        color: #94a3b8;
        cursor: pointer;
        padding: 0.8rem 0.4rem;
        font-size: 0.76rem;
        font-weight: 800;
        text-align: left;
      }

      .shape-menu > button.selected {
        color: #f8fafc;
        box-shadow: inset 3px 0 var(--active-team);
        padding-left: 0.8rem;
      }

      .shape-workbench {
        padding: clamp(1rem, 2vw, 1.75rem);
      }

      .preset-row {
        display: flex;
        gap: 0.45rem;
        margin-bottom: 1rem;
      }

      .pitch-board {
        position: relative;
        width: min(620px, 100%);
        aspect-ratio: 0.7;
        margin: 0 auto;
        overflow: hidden;
        border: 4px solid #e2e8f0;
        outline: 1px solid #38bdf8;
        background:
          repeating-linear-gradient(
            0deg,
            rgb(255 255 255 / 3%) 0 9.8%,
            rgb(255 255 255 / 15%) 10%
          ),
          #28724b;
        box-shadow: 0 10px 24px rgb(0 0 0 / 35%);
        touch-action: none;
      }

      .pitch-board::before,
      .pitch-half,
      .pitch-22 {
        position: absolute;
        content: "";
        background: rgb(226 232 240 / 85%);
        pointer-events: none;
      }

      .pitch-board::before {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        opacity: 0.35;
      }

      .pitch-half {
        top: 50%;
        right: 0;
        left: 0;
        height: 2px;
      }

      .pitch-22 {
        right: 0;
        left: 0;
        height: 1px;
        opacity: 0.75;
      }

      .pitch-22.north {
        top: 22%;
      }
      .pitch-22.south {
        bottom: 22%;
      }

      .shape-player {
        position: absolute;
        z-index: 2;
        top: var(--z);
        left: var(--x);
        display: grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border: 2px solid #f8f3e6;
        border-radius: 50%;
        background: var(--team-color);
        color: white;
        cursor: grab;
        font-size: 0.68rem;
        font-weight: 950;
        transform: translate(-50%, -50%);
        box-shadow: 0 2px 5px rgb(0 0 0 / 30%);
        touch-action: none;
      }

      .shape-player:active {
        cursor: grabbing;
        transform: translate(-50%, -50%) scale(1.12);
      }

      @media (max-width: 1050px) {
        .ratings-grid {
          grid-template-columns: repeat(4, 1fr);
        }

        .roster-head,
        .roster-row {
          grid-template-columns: 2rem minmax(130px, 1fr) repeat(4, 3.5rem);
        }

        .roster-head > :nth-child(4),
        .roster-head > :nth-child(5),
        .roster-head > :nth-child(6),
        .roster-row > :nth-child(4),
        .roster-row > :nth-child(5),
        .roster-row > :nth-child(6) {
          display: none;
        }
      }

      @media (max-width: 760px) {
        .config-header {
          grid-template-columns: 1fr auto;
        }

        .team-switcher {
          grid-column: 1 / -1;
          grid-row: 2;
        }

        .team-switcher button {
          min-width: 0;
        }

        .config-tabs {
          overflow-x: auto;
          padding-inline: 0.5rem;
        }

        .team-identity {
          display: none;
        }

        .ratings-grid,
        .mix-stack,
        .choice-row {
          grid-template-columns: 1fr;
        }

        .squad-layout {
          grid-template-columns: 1fr;
        }

        .team-ratings {
          grid-column: auto;
        }

        .player-editor {
          position: static;
          grid-row: 2;
        }

        .shape-layout {
          grid-template-columns: 1fr;
        }

        .shape-menu {
          display: flex;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid rgb(255 255 255 / 12%);
        }

        .shape-menu .eyebrow {
          display: none;
        }

        .shape-menu > button {
          min-width: max-content;
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="pregame"></div>

    <!-- TV Broadcast Bug UI -->
    <div id="tv-scoreboard" class="tv-bug" aria-live="polite">
      <div class="tv-top-row">
        <div class="tv-team tv-team-0" id="tv-team-0">
          <span class="tv-team-badge"></span>
          <span class="tv-team-name" id="tv-team0-name">BLU</span>
          <span class="tv-team-score" id="tv-team0-score">0</span>
        </div>
        <div class="tv-team-divider"></div>
        <div class="tv-team tv-team-1" id="tv-team-1">
          <span class="tv-team-score" id="tv-team1-score">0</span>
          <span class="tv-team-name" id="tv-team1-name">RED</span>
          <span class="tv-team-badge"></span>
        </div>
        <div class="tv-clock-box">
          <span id="tv-clock" class="tv-clock">00:00</span>
          <span id="tv-half" class="tv-half">1ST</span>
        </div>
      </div>
      <div class="tv-bottom-bar">
        <span id="tv-phase-pill" class="tv-phase-pill">PHASE 1</span>
        <span id="tv-meters" class="tv-meters">+0m</span>
        <span id="tv-shot-clock" class="tv-shot-clock" hidden>SHOT 30</span>
        <span id="tv-status" class="tv-status">KICKOFF</span>
      </div>
    </div>

    <!-- Bottom Left Collapsible Controls -->
    <div id="ui-controls">
      <div class="controls-header-bar" id="controls-header">
        <span>⚙ Simulation Controls</span>
        <button
          type="button"
          id="controls-toggle-btn"
          class="controls-toggle-btn"
        >
          Minimize
        </button>
      </div>
      <div class="controls-panel" id="controls-panel">
        <div class="control-row">
          <div class="control-header">
            <span>Sim Speed</span>
            <span id="speed-display" class="speed-val">1.0×</span>
          </div>
          <input
            type="range"
            id="speed-slider"
            min="0.1"
            max="10"
            step="0.1"
            value="1"
          />
        </div>
        <div class="cam-row">
          <span class="cam-label"
            >Camera
            <span style="font-weight: 400; color: #94a3b8"
              >(C to cycle · scroll to zoom)</span
            ></span
          >
          <div class="cam-buttons">
            <button type="button" data-cam="halfway" class="cam-btn active">
              Halfway
            </button>
            <button type="button" data-cam="goalLine" class="cam-btn">
              Goal line
            </button>
            <button type="button" data-cam="free" class="cam-btn">Free</button>
          </div>
          <div id="goal-line-side-control" hidden>
            <span class="cam-hint">Goal side</span>
            <div class="cam-buttons">
              <button
                type="button"
                data-goal-side="south"
                class="cam-btn active"
              >
                South
              </button>
              <button type="button" data-goal-side="north" class="cam-btn">
                North
              </button>
            </div>
          </div>
        </div>
        <label class="toggle-row" id="auto-follow-row" for="auto-follow-toggle">
          <span>Auto-follow ball</span>
          <div class="toggle-switch">
            <input type="checkbox" id="auto-follow-toggle" checked />
            <span class="slider"></span>
          </div>
        </label>
        <div class="control-row">
          <div class="control-header">
            <span>Zoom</span>
            <span id="zoom-display" class="speed-val">1.0×</span>
          </div>
          <input
            type="range"
            id="zoom-slider"
            min="0.5"
            max="2.3"
            step="0.1"
            value="1"
          />
          <span class="cam-hint"
            >Broadcast: distance · disable follow to drag · Free: FOV + WASD +
            drag · Q/E up/down</span
          >
        </div>
        <label class="toggle-row" for="debug-toggle">
          <span>Debug Mode</span>
          <div class="toggle-switch">
            <input type="checkbox" id="debug-toggle" />
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </div>

    <!-- Standalone Floating Manager View Button -->
    <button
      type="button"
      id="manager-view-btn"
      class="manager-view-btn-floating"
    >
      📋 Manager View (M)
    </button>

    <!-- Manager View Modal -->
    <div
      id="manager-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="manager-modal-title"
    >
      <div class="manager-dialog">
        <div class="manager-header">
          <div class="manager-title" id="manager-modal-title">
            📋 Team Management Dashboard
          </div>
          <button
            type="button"
            id="manager-close-btn"
            class="manager-close-btn"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div class="manager-tabs">
          <div class="manager-team-tabs">
            <button
              type="button"
              class="team-tab-btn active"
              data-team="0"
              id="tab-team-0"
            >
              🔵 Blue Team
            </button>
            <button
              type="button"
              class="team-tab-btn"
              data-team="1"
              id="tab-team-1"
            >
              🔴 Red Team
            </button>
          </div>
          <div class="manager-subtabs">
            <button
              type="button"
              class="manager-subtab-btn active"
              id="subtab-roster"
            >
              👥 Squad & Condition
            </button>
            <button type="button" class="manager-subtab-btn" id="subtab-stats">
              📊 Game Stats
            </button>
          </div>
        </div>
        <div class="manager-body">
          <div class="team-summary-card" id="manager-team-summary"></div>
          <table class="roster-table">
            <thead id="manager-roster-thead">
              <tr>
                <th class="player-num-col">#</th>
                <th>Player / Role</th>
                <th>Physicals</th>
                <th>Skill</th>
                <th>Condition</th>
              </tr>
            </thead>
            <tbody id="manager-roster-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <output id="scoreboard" aria-live="polite"></output>
    <div id="debug-overlay"></div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
