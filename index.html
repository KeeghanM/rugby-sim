<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rugby Sim</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
      }

      #renderCanvas {
        display: block;
        width: 100dvw;
        height: 100dvh;
        touch-action: none;
      }

      /* TV Broadcast Bug - Top Left */
      #tv-scoreboard {
        position: fixed;
        z-index: 25;
        top: 1.2rem;
        left: 1.2rem;
        display: flex;
        flex-direction: column;
        border-radius: 0.5rem;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          rgb(15 23 42 / 92%) 0%,
          rgb(30 41 59 / 95%) 100%
        );
        backdrop-filter: blur(10px);
        border: 1px solid rgb(255 255 255 / 18%);
        box-shadow:
          0 8px 24px rgb(0 0 0 / 55%),
          inset 0 1px 0 rgb(255 255 255 / 15%);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #f8fafc;
        min-width: 270px;
      }

      .tv-top-row {
        display: flex;
        align-items: stretch;
        height: 38px;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
      }

      .tv-team {
        display: flex;
        align-items: center;
        flex: 1;
        padding: 0 0.6rem;
        gap: 0.4rem;
        border-bottom: 3px solid transparent;
        transition: border-bottom-color 0.2s ease, background 0.2s ease;
      }

      .tv-team.possession.tv-team-0 {
        border-bottom: 3px solid #3b82f6;
        background: rgb(59 130 246 / 20%);
      }

      .tv-team.possession.tv-team-1 {
        border-bottom: 3px solid #ef4444;
        background: rgb(239 68 68 / 20%);
      }

      .tv-team-badge {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .tv-team-0 .tv-team-badge {
        background: #1d4ed8;
        box-shadow: 0 0 8px #3b82f6;
      }
      .tv-team-1 .tv-team-badge {
        background: #dc2626;
        box-shadow: 0 0 8px #ef4444;
      }

      .tv-team-name {
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.05em;
        color: #f1f5f9;
      }

      .tv-team-score {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1.25rem;
        font-weight: 800;
        color: #ffffff;
        margin-left: auto;
      }

      .tv-team-1 .tv-team-score {
        margin-left: 0;
        margin-right: auto;
      }

      .tv-team-divider {
        width: 1px;
        background: rgb(255 255 255 / 15%);
        margin: 4px 0;
      }

      .tv-clock-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 0.65rem;
        background: rgb(0 0 0 / 35%);
        border-left: 1px solid rgb(255 255 255 / 12%);
        min-width: 68px;
      }

      .tv-clock {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88rem;
        font-weight: 700;
        color: #38bdf8;
        line-height: 1.1;
      }

      .tv-half {
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #94a3b8;
        text-transform: uppercase;
      }

      .tv-bottom-bar {
        display: flex;
        align-items: center;
        padding: 0.35rem 0.6rem;
        gap: 0.5rem;
        background: rgb(0 0 0 / 25%);
        font-size: 0.74rem;
      }

      .tv-phase-pill {
        background: #eab308;
        color: #0f172a;
        font-weight: 800;
        font-size: 0.65rem;
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .tv-meters {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        color: #4ade80;
        font-size: 0.8rem;
      }

      .tv-status {
        color: #cbd5e1;
        font-weight: 500;
        margin-left: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 140px;
      }

      #scoreboard {
        display: none;
      }

      #ui-controls {
        position: fixed;
        z-index: 20;
        bottom: 1.2rem;
        left: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        padding: 0.75rem 0.9rem;
        border-radius: 0.5rem;
        background: rgb(15 23 42 / 85%);
        backdrop-filter: blur(8px);
        border: 1px solid rgb(255 255 255 / 15%);
        color: #f8fafc;
        box-shadow: 0 4px 16px rgb(0 0 0 / 40%);
        font-size: 0.82rem;
        min-width: 200px;
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      #ui-controls.collapsed .controls-panel {
        display: none;
      }

      .controls-header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        color: #94a3b8;
        cursor: pointer;
      }

      .controls-toggle-btn {
        background: none;
        border: none;
        color: #38bdf8;
        font:
          600 0.78rem system-ui,
          sans-serif;
        cursor: pointer;
        padding: 0.2rem 0.4rem;
        border-radius: 0.3rem;
      }

      .controls-toggle-btn:hover {
        background: rgb(255 255 255 / 10%);
      }

      .controls-panel {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .control-row {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .control-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 500;
        color: #cbd5e1;
      }

      .speed-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 600;
        color: #38bdf8;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 5px;
        border-radius: 3px;
        background: #334155;
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #38bdf8;
        cursor: pointer;
        box-shadow: 0 0 6px rgb(56 189 248 / 60%);
        transition: transform 0.1s;
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: #38bdf8;
        cursor: pointer;
        box-shadow: 0 0 6px rgb(56 189 248 / 60%);
        transition: transform 0.1s;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        padding-top: 0.4rem;
        border-top: 1px solid rgb(255 255 255 / 10%);
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #334155;
        transition: 0.2s;
        border-radius: 18px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: #38bdf8;
      }

      input:checked + .slider:before {
        transform: translateX(16px);
      }

      #debug-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 10;
        display: none;
      }

      .debug-card {
        position: absolute;
        transform: translate(-50%, -100%) translateY(-8px);
        background: rgb(15 23 42 / 92%);
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 5px;
        padding: 4px 6px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        line-height: 1.25;
        color: #f1f5f9;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgb(0 0 0 / 50%);
        display: none;
        backdrop-filter: blur(4px);
        pointer-events: none;
      }

      .debug-card.team-0 {
        border-left: 3px solid #3b82f6;
      }

      .debug-card.team-1 {
        border-left: 3px solid #ef4444;
      }

      .debug-card.ball-card {
        border-left: 3px solid #facc15;
      }

      .debug-card-header {
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 700;
        font-size: 10px;
        margin-bottom: 2px;
        color: #ffffff;
      }

      .debug-card-row {
        color: #94a3b8;
      }

      .debug-card-row .val {
        color: #e2e8f0;
        font-weight: 500;
      }

      .debug-card-row .highlight {
        color: #facc15;
        font-weight: 600;
      }

      .debug-badge {
        display: inline-block;
        padding: 1px 3px;
        border-radius: 2px;
        font-size: 8.5px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge-carrier {
        background: #eab308;
        color: #000;
      }

      .badge-offside {
        background: #ef4444;
        color: #fff;
      }

      .cam-row {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        padding-top: 0.4rem;
        border-top: 1px solid rgb(255 255 255 / 10%);
      }

      .cam-label {
        font-weight: 500;
        color: #cbd5e1;
      }

      .cam-buttons {
        display: flex;
        gap: 0.35rem;
      }

      .cam-btn {
        flex: 1;
        padding: 0.3rem 0.4rem;
        border-radius: 0.35rem;
        border: 1px solid rgb(255 255 255 / 15%);
        background: #334155;
        color: #e2e8f0;
        font:
          600 0.73rem/1 system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }

      .cam-btn:hover {
        background: #475569;
      }

      .cam-btn.active {
        background: #38bdf8;
        border-color: #38bdf8;
        color: #0f172a;
      }

      .cam-hint {
        font-size: 0.7rem;
        color: #94a3b8;
        line-height: 1.3;
      }

      .manager-view-btn-floating {
        position: fixed;
        z-index: 22;
        top: 1.2rem;
        right: 1.2rem;
        margin-left: 215px;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgb(56 189 248 / 40%);
        color: #38bdf8;
        font:
          700 0.82rem/1.2 system-ui,
          sans-serif;
        padding: 0.55rem 0.85rem;
        border-radius: 0.5rem;
        cursor: pointer;
        box-shadow: 0 4px 16px rgb(0 0 0 / 45%);
        backdrop-filter: blur(8px);
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .manager-view-btn-floating:hover {
        background: #334155;
        border-color: #38bdf8;
        transform: translateY(-1px);
      }

      /* Manager View Modal */
      #manager-modal {
        position: fixed;
        z-index: 50;
        inset: 0;
        background: rgb(0 0 0 / 70%);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      #manager-modal.active {
        display: flex;
      }

      .manager-dialog {
        background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 0.75rem;
        box-shadow: 0 20px 45px rgb(0 0 0 / 70%);
        width: 100%;
        max-width: 820px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: #f8fafc;
      }

      .manager-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        background: rgb(0 0 0 / 25%);
      }

      .manager-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .manager-close-btn {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 1.3rem;
        cursor: pointer;
        padding: 0.2rem 0.5rem;
        border-radius: 0.3rem;
        line-height: 1;
      }

      .manager-close-btn:hover {
        color: #ffffff;
        background: rgb(255 255 255 / 10%);
      }

      .manager-tabs {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem 0;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
      }

      .manager-team-tabs {
        display: flex;
        gap: 0.5rem;
      }

      .manager-subtabs {
        display: flex;
        gap: 0.35rem;
        background: rgb(0 0 0 / 30%);
        padding: 0.2rem;
        border-radius: 0.4rem;
        border: 1px solid rgb(255 255 255 / 10%);
        margin-bottom: 0.4rem;
      }

      .manager-subtab-btn {
        padding: 0.3rem 0.65rem;
        border: none;
        background: transparent;
        color: #94a3b8;
        font: 600 0.76rem system-ui, sans-serif;
        cursor: pointer;
        border-radius: 0.3rem;
        transition: background 0.15s, color 0.15s;
      }

      .manager-subtab-btn:hover {
        color: #f1f5f9;
      }

      .manager-subtab-btn.active {
        background: #38bdf8;
        color: #0f172a;
      }

      .stat-highlight-gold {
        color: #facc15;
        font-weight: 700;
      }

      .stat-highlight-cyan {
        color: #38bdf8;
        font-weight: 700;
      }

      .stat-highlight-green {
        color: #4ade80;
        font-weight: 700;
      }

      .team-tab-btn {
        padding: 0.5rem 1rem;
        border: none;
        border-bottom: 2px solid transparent;
        background: none;
        color: #94a3b8;
        font:
          600 0.88rem system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .team-tab-btn.active {
        color: #38bdf8;
        border-bottom-color: #38bdf8;
      }

      .manager-body {
        padding: 1rem 1.25rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .team-summary-card {
        background: rgb(0 0 0 / 30%);
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.75rem;
        font-size: 0.8rem;
      }

      .summary-item {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .summary-label {
        color: #94a3b8;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .summary-val {
        font-weight: 600;
        color: #f1f5f9;
      }

      .roster-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }

      .roster-table th {
        text-align: left;
        padding: 0.45rem 0.6rem;
        color: #94a3b8;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
      }

      .roster-table td {
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid rgb(255 255 255 / 6%);
        vertical-align: middle;
      }

      .roster-table tr:hover td {
        background: rgb(255 255 255 / 4%);
      }

      .player-num-col {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        color: #38bdf8;
        width: 32px;
      }

      .player-role-col {
        font-weight: 600;
        color: #f1f5f9;
      }

      .player-pod-badge {
        display: inline-block;
        padding: 0.1rem 0.35rem;
        border-radius: 0.2rem;
        font-size: 0.68rem;
        background: rgb(255 255 255 / 10%);
        color: #cbd5e1;
        margin-left: 0.4rem;
      }

      .skill-badge {
        font-weight: 700;
        color: #facc15;
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
      }

      /* Stamina Indicative Bar (No exact percentage text) */
      .stamina-bar-container {
        width: 110px;
        height: 8px;
        background: #334155;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .stamina-bar-fill {
        height: 100%;
        border-radius: 4px;
        transition:
          width 0.2s,
          background-color 0.2s;
        background: #22c55e;
      }

      .stamina-bar-fill.stamina-mid {
        background: #eab308;
      }

      .stamina-bar-fill.stamina-low {
        background: #ef4444;
      }
    </style>
  </head>
  <body>
    <!-- TV Broadcast Bug UI -->
    <div id="tv-scoreboard" class="tv-bug" aria-live="polite">
      <div class="tv-top-row">
        <div class="tv-team tv-team-0" id="tv-team-0">
          <span class="tv-team-badge"></span>
          <span class="tv-team-name" id="tv-team0-name">BLU</span>
          <span class="tv-team-score" id="tv-team0-score">0</span>
        </div>
        <div class="tv-team-divider"></div>
        <div class="tv-team tv-team-1" id="tv-team-1">
          <span class="tv-team-score" id="tv-team1-score">0</span>
          <span class="tv-team-name" id="tv-team1-name">RED</span>
          <span class="tv-team-badge"></span>
        </div>
        <div class="tv-clock-box">
          <span id="tv-clock" class="tv-clock">00:00</span>
          <span id="tv-half" class="tv-half">1ST</span>
        </div>
      </div>
      <div class="tv-bottom-bar">
        <span id="tv-phase-pill" class="tv-phase-pill">PHASE 1</span>
        <span id="tv-meters" class="tv-meters">+0m</span>
        <span id="tv-status" class="tv-status">KICKOFF</span>
      </div>
    </div>

    <!-- Bottom Left Collapsible Controls -->
    <div id="ui-controls">
      <div class="controls-header-bar" id="controls-header">
        <span>⚙ Simulation Controls</span>
        <button
          type="button"
          id="controls-toggle-btn"
          class="controls-toggle-btn"
        >
          Minimize
        </button>
      </div>
      <div class="controls-panel" id="controls-panel">
        <div class="control-row">
          <div class="control-header">
            <span>Sim Speed</span>
            <span id="speed-display" class="speed-val">1.0×</span>
          </div>
          <input
            type="range"
            id="speed-slider"
            min="0.1"
            max="10"
            step="0.1"
            value="1"
          />
        </div>
        <div class="cam-row">
          <span class="cam-label"
            >Camera
            <span style="font-weight: 400; color: #94a3b8"
              >(C to cycle · scroll to zoom)</span
            ></span
          >
          <div class="cam-buttons">
            <button type="button" data-cam="halfway" class="cam-btn active">
              Halfway
            </button>
            <button type="button" data-cam="ball" class="cam-btn">Ball</button>
            <button type="button" data-cam="free" class="cam-btn">Free</button>
          </div>
        </div>
        <div class="control-row">
          <div class="control-header">
            <span>Zoom</span>
            <span id="zoom-display" class="speed-val">1.0×</span>
          </div>
          <input
            type="range"
            id="zoom-slider"
            min="0.5"
            max="2.3"
            step="0.1"
            value="1"
          />
          <span class="cam-hint"
            >Halfway/Ball: distance · Free: FOV + WASD + drag · Q/E
            up/down</span
          >
        </div>
        <label class="toggle-row" for="debug-toggle">
          <span>Debug Mode</span>
          <div class="toggle-switch">
            <input type="checkbox" id="debug-toggle" />
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </div>

    <!-- Standalone Floating Manager View Button -->
    <button
      type="button"
      id="manager-view-btn"
      class="manager-view-btn-floating"
    >
      📋 Manager View (M)
    </button>

    <!-- Manager View Modal -->
    <div
      id="manager-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="manager-modal-title"
    >
      <div class="manager-dialog">
        <div class="manager-header">
          <div class="manager-title" id="manager-modal-title">
            📋 Team Management Dashboard
          </div>
          <button
            type="button"
            id="manager-close-btn"
            class="manager-close-btn"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div class="manager-tabs">
          <div class="manager-team-tabs">
            <button
              type="button"
              class="team-tab-btn active"
              data-team="0"
              id="tab-team-0"
            >
              🔵 Blue Team
            </button>
            <button
              type="button"
              class="team-tab-btn"
              data-team="1"
              id="tab-team-1"
            >
              🔴 Red Team
            </button>
          </div>
          <div class="manager-subtabs">
            <button
              type="button"
              class="manager-subtab-btn active"
              id="subtab-roster"
            >
              👥 Squad & Condition
            </button>
            <button
              type="button"
              class="manager-subtab-btn"
              id="subtab-stats"
            >
              📊 Game Stats
            </button>
          </div>
        </div>
        <div class="manager-body">
          <div class="team-summary-card" id="manager-team-summary"></div>
          <table class="roster-table">
            <thead id="manager-roster-thead">
              <tr>
                <th class="player-num-col">#</th>
                <th>Player / Role</th>
                <th>Physicals</th>
                <th>Skill</th>
                <th>Condition</th>
              </tr>
            </thead>
            <tbody id="manager-roster-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <output id="scoreboard" aria-live="polite"></output>
    <div id="debug-overlay"></div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
